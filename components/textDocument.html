<div id="textDocument" data-title="Text Document" data-icon="bi-file-text" style="height:75vh;"
     class="window position-fixed top-50 start-50 translate-middle bg-dark text-light rounded shadow d-none w-75 d-flex flex-column">

    <!-- Title bar -->
    <div class="d-flex justify-content-between align-items-center px-2 py-2 border-bottom border-secondary">
        <strong>Text Document</strong>
        <div>
            <button class="btn btn-sm btn-secondary minimize">—</button>
            <button class="btn btn-sm btn-secondary maximize">▢</button>
            <button class="btn btn-sm btn-danger close">✕</button>
        </div>
    </div>

    <!-- Menu -->
    <div class="px-3 py-2 border-bottom border-secondary small">
        <span class="me-3">File</span>
        <span class="me-3">Edit</span>
        <span class="me-3">View</span>
        <span class="me-3">Help</span>
    </div>

    <!-- Text Area -->
    <div class="flex-grow-1">
        <textarea class="form-control bg-dark text-light border-0 h-100 rounded-0" style="resize:none;"></textarea>
    </div>

</div>
